name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write, so an @claude task can commit and push a fix rather than only
      # describe one. This was `contents: read` deliberately — that read was the
      # one thing keeping the action from writing to a branch — and the operator
      # chose to grant the write. Anything that can post `@claude` on an issue or
      # PR comment can now reach a branch through this job.
      contents: write
      # write (not read) on both: this workflow answers by posting a comment, on
      # issues as well as PRs, which the read-only defaults silently forbid.
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Without these the prompt's verify commands below cannot run — this job
      # otherwise checks out the repo and nothing else.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-5-5'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Project rules are NOT duplicated here. The action's injected system
          # prompt already says "Always check for and follow the repository's
          # CLAUDE.md file(s)", and CLAUDE.md imports AGENTS.md, so this prompt
          # points at them instead. Inlining a copy means two places to keep in
          # sync and one of them silently going stale.
          prompt: |
            ## Google-Drive-MCP

            Read `AGENTS.md` before changing behavior it covers. It is the single
            source for this repo's policy, layout, conventions and known pitfalls,
            and `CLAUDE.md` imports it.

            ### Before you claim it works

            Dependencies are installed already. Run what your change touches:

            - `npm run build` — `tsc`. Run this FIRST if you invoke `node --test`
              directly: the tests import from `dist/`, which is gitignored, so an
              unbuilt tree has nothing to test against.
            - `npm test` — pretest `tsc` then `node --test tests/*.test.js`
              (`package.json`). Do not invoke `node --test tests/` (the
              directory): Node 24 resolves that as a module and fails with
              MODULE_NOT_FOUND.

            There is no linter and no `lint` script, by design. Do not add one and
            do not reformat a file you are editing — `src/server.ts` indentation is
            deliberately inconsistent, so match the surrounding block.

            Do NOT claim the server itself starts or that any Google API call
            works. That needs `credentials.json` and `token.json`, which are
            gitignored OAuth secrets this job does not have. The unit suite runs
            against mocks.

            If you could not verify something, say so plainly rather than
            implying it passed.

            ---

            Now execute the task from the comment that tagged you.
