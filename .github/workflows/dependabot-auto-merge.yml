# Enable GitHub auto-merge for Dependabot patch and minor PRs.
# Majors stay open for a human. Required check `build-test-token-cost`
# on `main` is what `--auto` waits on.

name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh pr merge --auto --squash "$PR_URL"; then
            exit 0
          fi
          # --auto is refused when the PR is already mergeable. Only squash
          # immediately if every other check has already finished green.
          pending=$(gh pr checks "$PR_URL" --json name,bucket --jq \
            '[.[] | select(.name != "dependabot") | select(.bucket == "pending" or .bucket == "fail" or .bucket == "cancel")] | length')
          if [ "$pending" -eq 0 ]; then
            gh pr merge --squash "$PR_URL"
            exit 0
          fi
          echo "Auto-merge could not be enabled and other checks are not all green."
          exit 1
